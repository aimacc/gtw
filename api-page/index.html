 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/src/icon.png" type="image/png">

    <title id="page"></title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"/>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="/styles.css">

</head>
<body>

    <!-- LOADING -->
    <div id="loadingScreen">
        <div class="spinner-wrapper">
            <div class="spinner-border text-dark mb-2" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Waitt...</p>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" style="display: flex; align-items: center;">
                <span id="header" class="me-2"></span>

                <div id="versionHeader"
                    style="
                    background-color: #333;
                    color: white;
                    padding: 4px 12px;
                    font-size: 12px;
                    border-radius: 100px;
                ">
                </div>

            </a>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container">

        <!-- BANNER -->
        <img
            id="dynamicImage"
            class="banner mb-4"
            style="border-radius: 8px;"
            src=""
        >

        <!-- NAME -->
        <div id="nameContainer" style="display: flex; align-items: center;">

            <h1 id="name"
                style="
                font-size: 32px;
                margin-right: 10px;
            ">
            </h1>

            <div id="version"
                style="
                background-color: #333;
                color: white;
                padding: 5px 12px;
                font-size: 12px;
                border-radius: 100px;
            ">
            </div>

        </div>

        <p id="description" class="lead mb-3"></p>

        <div id="apiLinks" class="mb-5"></div>

        <input
            type="text"
            id="searchInput"
            class="form-control mb-5"
            placeholder="Search API..."
        >

        <!-- PAYMENT GATEWAY -->
        <div class="card border-0 shadow-sm mb-5">

            <div class="card-body">

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                ">

                    <div>
                        <h4 class="mb-1">Payment Gateway</h4>

                        <p class="text-muted mb-0" style="font-size:14px;">
                            Create & Check QRIS Payment
                        </p>
                    </div>

                    <div style="
                        background:#111;
                        color:white;
                        padding:5px 14px;
                        border-radius:999px;
                        font-size:12px;
                    ">
                        QRIS
                    </div>

                </div>

                <hr>

                <!-- INPUT -->
                <div class="mb-3">

                    <label class="form-label">
                        Nominal Payment
                    </label>

                    <div class="input-group">

                        <input
                            type="number"
                            id="nominalInput"
                            class="form-control"
                            placeholder="Masukkan nominal"
                        >

                        <button
                            class="btn btn-dark"
                            onclick="createPayment()"
                        >
                            Create
                        </button>

                    </div>

                </div>

                <!-- RESULT -->
                <div id="paymentResult" style="display:none;">

                    <div class="alert alert-dark">

                        <div id="trxInfo"></div>

                    </div>

                    <!-- QRIS -->
                    <div class="text-center">

                        <img
                            id="qrisImage"
                            src=""
                            style="
                                max-width:250px;
                                border-radius:10px;
                            "
                        >

                    </div>

                    <!-- BUTTON -->
                    <div class="d-grid mt-3">

                        <button
                            class="btn btn-success"
                            onclick="checkPayment()"
                        >
                            Cek Pembayaran
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- API CONTENT -->
        <div class="tab-content" id="apiContent"></div>

    </div>

    <!-- MODAL -->
    <div class="modal fade"
        id="apiResponseModal"
        tabindex="-1"
        aria-labelledby="apiResponseModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered" id="modalDialog">

            <div class="modal-content">

                <div class="modal-header">

                    <div>

                        <h5 class="modal-title" id="apiResponseModalLabel"></h5>

                        <p class="modal-desc text-muted mb-0"
                            id="apiResponseModalDesc"
                            style="font-size: 14px;">
                        </p>

                    </div>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>

                </div>

                <div class="modal-body">

                    <pre id="apiEndpoint"
                        style="
                        background-color: #f8f9fa;
                        padding: 10px;
                        border-radius: 5px;
                    ">
                    </pre>

                    <div id="apiQueryInputContainer"></div>

                    <div id="apiResponseLoading"
                        class="d-none d-flex justify-content-center align-items-center"
                        style="height: 100px;">

                        <div class="spinner-border custom-spinner" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>

                    </div>

                    <pre id="apiResponseContent"
                        class="d-none mt-2"
                        style="
                        background-color: #f8f9fa;
                        padding: 10px;
                        border-radius: 5px;
                    ">
                    </pre>

                </div>

                <div class="modal-footer">

                    <button
                        id="submitQueryBtn"
                        class="btn btn-dark">
                        Submit
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/script.js"></script>

    <!-- PAYMENT SCRIPT -->
    <script>

    let currentTrx = null

    // CREATE PAYMENT
    async function createPayment() {

        const nominal =
        document.getElementById("nominalInput").value

        if (!nominal) {
            return alert("Masukkan nominal")
        }

        try {

            const response = await fetch(
            `/payment?action=create&nominal=${nominal}`
            )

            const data = await response.json()

            if (!data.status) {
                return alert(data.message)
            }

            currentTrx = data.result.trxid

            document.getElementById(
            "paymentResult"
            ).style.display = "block"

            document.getElementById("trxInfo").innerHTML = `
            <b>TRX ID:</b> ${data.result.trxid}<br>
            <b>Nominal:</b> Rp${data.result.amount}<br>
            <b>Status:</b> ${data.result.status}<br>
            <b>Expired:</b> ${data.result.expired}
            `

            document.getElementById(
            "qrisImage"
            ).src = data.result.qris

        } catch (e) {

            console.log(e)

            alert("Gagal membuat pembayaran")

        }

    }

    // CHECK PAYMENT
    async function checkPayment() {

        if (!currentTrx) {
            return alert("Tidak ada transaksi")
        }

        try {

            const response = await fetch(
            `/payment?action=cekpay&trxid=${currentTrx}`
            )

            const data = await response.json()

            if (!data.status) {
                return alert(data.message)
            }

            // PENDING
            if (data.result.status === "PENDING") {

                alert("Pembayaran masih pending")

            } else {

                alert(
                `Pembayaran berhasil!\nTRX ID: ${data.result.trxid}`
                )

                document.getElementById("trxInfo").innerHTML = `
                <b>TRX ID:</b> ${data.result.trxid}<br>
                <b>Nominal:</b> Rp${data.result.amount}<br>
                <b>Status:</b> PAID<br>
                <b>Brand:</b> ${data.result.brand}<br>
                <b>Tanggal:</b> ${data.result.tanggal}
                `

            }

        } catch (e) {

            console.log(e)

            alert("Gagal cek pembayaran")

        }

    }

    </script>

</body>
</html>
